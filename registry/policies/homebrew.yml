version: 1
project: Homebrew
policy_url: https://github.com/Homebrew/brew/blob/main/CONTRIBUTING.md
homepage: https://brew.sh/
repos:
  - github.com/Homebrew/*
stance: allowed
autonomous_agents: unspecified
disclosure: required
human_in_the_loop: required
copyright_statement: false
trailer: null
forbidden_trailers:
  - Assisted-by
  - Co-authored-by
  - Co-developed-by
  - Signed-off-by
notes: >
  State up front that you used AI and which tool or model. You must NOT attribute a commit
  to an AI as author, co-author, committer or signatory, including through an Assisted-by
  or Co-developed-by trailer -- the opposite of the Linux kernel rule. You must address
  maintainer questions and review comments yourself, without AI. Non-maintainers may have
  only ONE AI-assisted pull request open at a time.
sources:
  - https://github.com/Homebrew/brew/blob/main/CONTRIBUTING.md
confidence: verified
updated: 2026-08-29
