trailer: Assisted-by
notes: >
  QEP 408 adopts the LLVM policy almost verbatim, including its phrasing. "Contributors can
  use whatever tools they would like to craft their contributions" but "there must be a
  human in the loop" -- you must read and review all LLM-generated code or text before
  asking others to review it. Label contributions containing substantial tool-generated
  content; a commit trailer like Assisted-by is given as the recommended way, not mandated.
  Agents that take action in the project's digital spaces without human approval, such as
  the GitHub @claude agent, are banned.
