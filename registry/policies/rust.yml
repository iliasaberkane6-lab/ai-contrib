version: 1
project: Rust
policy_url: https://forge.rust-lang.org/policies/llm-usage.html
homepage: https://www.rust-lang.org/
repos:
  - github.com/rust-lang/*
stance: restricted
autonomous_agents: forbidden
disclosure: required
human_in_the_loop: required
copyright_statement: false
trailer: null
scope:
  review: allowed
notes: >
  The dividing line is creation: "It's fine to use LLMs to answer questions, analyze,
  distill, refine, check, suggest, review. But not to create." LLM-CREATED pull requests
  are allowed only under experimental rules -- pre-arranged with a reviewer who has agreed
  in advance to review one, non-critical, high-quality, well-tested -- and must carry the
  `llm-assisted` label. A new contributor cannot open one without securing that commitment
  first. All uses in the "allowed with caveats" tier must disclose that an LLM was used.
sources:
  - https://forge.rust-lang.org/policies/llm-usage.html
confidence: verified
updated: 2026-08-29
