notes: >
  Restricted because the rule depends on who you are: "If you are a new contributor to
  SymPy, we will most likely close any issues, discussions, or pull requests that are
  substantially generated by AI." Established contributors who substantially use AI must
  disclose how it was used and which code is AI generated. It is not acceptable to submit
  a patch you cannot understand and explain yourself. Do not use AI to speak for you in
  developer communication, other than for translation or grammar editing.
