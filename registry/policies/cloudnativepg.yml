version: 1
project: CloudNativePG
policy_url: https://github.com/cloudnative-pg/governance/blob/main/AI_POLICY.md
homepage: https://cloudnative-pg.io/
repos:
  - github.com/cloudnative-pg/*
stance: allowed
autonomous_agents: unspecified
disclosure: required_if_substantial
human_in_the_loop: required
copyright_statement: false
trailer: Assisted-by
notes: >
  The most specific trailer format in this registry: "Assisted-by: Name of AI", with the
  model version included -- the policy's own examples are "Assisted-by: ChatGPT 5.2" and
  "Assisted-by: Claude Opus 4.5". Disclose in the PR description when AI generated a
  significant portion beyond simple autocomplete. "You must fully understand every line of
  code you submit" and "you are responsible for the long-term maintenance of that code."
  Vague or flowery AI-written PR descriptions that do not describe the technical change
  are called out explicitly.
sources:
  - https://github.com/cloudnative-pg/governance/blob/main/AI_POLICY.md
confidence: verified
updated: 2026-08-29
