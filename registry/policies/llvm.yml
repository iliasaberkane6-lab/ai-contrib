notes: >
  Contributors must read and review all LLM-generated content before requesting review,
  and must label contributions containing substantial tool-generated content. Agents that
  act in LLVM's digital spaces without human approval are banned. Using AI tools to fix
  issues labelled "good first issue" is forbidden.
