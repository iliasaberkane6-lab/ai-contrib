version: 1
project: Cilium
policy_url: https://github.com/cilium/community/blob/main/AI-POLICY.md
homepage: https://cilium.io/
repos:
  - github.com/cilium/*
stance: allowed
autonomous_agents: unspecified
disclosure: required_if_substantial
human_in_the_loop: required
copyright_statement: true
trailer: null
notes: >
  Generative AI is recognised as a helpful tool for explaining code, boilerplate completion
  and drafting tests. For non-trivial submissions you should describe how it was used and
  explain the human review process applied; trivial uses such as spell-checking need no
  declaration. "You are fully accountable for the correctness, security, and clarity of
  your contributions." Submitting content you have not reviewed in careful detail is not
  acceptable, and contributions must still satisfy the DCO and licensing requirements.
sources:
