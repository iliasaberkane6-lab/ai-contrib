notes: >
  The broadest agent ban in this registry: "Agents are strictly forbidden from interacting
  with our repository" -- covering posting issues, making pull requests, posting comments,
  posting code reviews and even adding reactions. Human AI use is welcome but all AI usage
  in any form must be disclosed, stating the tool (e.g. Claude Code, Cursor, Amp) and the
  extent of the assistance. The stated rationale is to keep low-quality "slop PRs" from
  overwhelming maintainers, not opposition to AI assistance as such.
