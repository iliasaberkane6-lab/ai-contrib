notes: >
  The broadest disclosure trigger in this registry -- it covers communication, not just
  code: "Any interaction that is modified, generated, or assisted -- in whole or in part --
  by automated tools must be explicitly disclosed." The disclosure must be included within
  the same interaction and name the specific tool used. "All interactions, contributions,
  and communications are attributed solely to the human actor."
