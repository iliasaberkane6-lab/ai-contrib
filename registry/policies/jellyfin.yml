version: 1
project: Jellyfin
policy_url: https://jellyfin.org/docs/general/contributing/llm-policies/
homepage: https://jellyfin.org/
repos:
  - github.com/jellyfin/*
stance: allowed
autonomous_agents: forbidden
disclosure: not_required
human_in_the_loop: required
copyright_statement: false
trailer: null
scope:
  issues: forbidden
notes: >
  "You are free to use LLMs to assist you, but not as the sole source of code changes." LLM
  output is expressly prohibited for any direct communication. You must review the output
  and explain in the PR body, in your own words, what is being changed and why; code that
  does not build and run correctly is rejected. Do not let an LLM loose on the codebase and
  commit the results as-is. Community projects that are primarily LLM-developed should be
  clearly marked as such.
sources:
