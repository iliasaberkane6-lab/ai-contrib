notes: >
  You must disclose whether AI was used, which tools, how, and which code or text is AI
  generated -- a pull request without that disclosure is rejected. An AI agent that writes
  code and submits a PR autonomously is not permitted; a human must check the generated
  code and submit it. You must be able to explain the code you submit and the existing
  related code. Do not use AI to auto-generate comments, PR descriptions or issue text.
