project: IREE
policy_url: https://iree.dev/developers/general/contributing/
homepage: https://iree.dev/
repos:
  - github.com/iree-org/iree
stance: allowed
autonomous_agents: review_required
disclosure: required_if_substantial
human_in_the_loop: required
copyright_statement: true
trailer: Assisted-by
notes: >
  Derived from the LLVM policy. Be transparent and label contributions containing
  substantial tool-generated content, using an "Assisted-by: tool-name" or
  "Co-authored-by: tool-name tool@email" trailer. Contributors must read and review all
  LLM-generated code or text before asking others to review it, and should write PR
  descriptions themselves. Unusually, bot-authored contributions ARE permitted as a
  carve-out -- dependency updates, build fixes and similar -- provided the bot's
  maintainers review them first.
sources:
  - https://iree.dev/developers/general/contributing/
