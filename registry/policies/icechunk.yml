version: 1
project: Icechunk
policy_url: https://icechunk.io/en/latest/reference/ai-policy/
homepage: https://icechunk.io/
repos:
  - github.com/earth-mover/icechunk
stance: allowed
autonomous_agents: review_required
disclosure: not_required
human_in_the_loop: required
copyright_statement: false
trailer: null
scope:
  issues: forbidden
notes: >
  Shares its text with the Xarray policy, down to the rejected phrasing: "I pointed an
  agent at the issue and here are the changes" is Not Acceptable, while thoughtful
  iteration with an agent is fine. No disclosure is mandated; understanding is. You must
  have personally reviewed and understood all changes, must be able to explain why each
  change is correct and how it fits the project, and PR descriptions, issue comments and
  review responses must be your own words. Open an issue first for a large contribution.
sources:
