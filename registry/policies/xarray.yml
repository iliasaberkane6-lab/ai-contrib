version: 1
project: Xarray
policy_url: https://github.com/pydata/xarray/blob/main/doc/contribute/ai-policy.md
homepage: https://xarray.dev/
repos:
  - github.com/pydata/xarray
stance: allowed
autonomous_agents: review_required
disclosure: not_required
human_in_the_loop: required
copyright_statement: false
trailer: null
scope:
  issues: forbidden
notes: >
  "Some Xarray developers use AI tools as part of our development workflow. We assume this
  is now common." No disclosure is mandated; understanding is. You must have personally
  reviewed and understood all changes before submitting, and PR descriptions, issue
  comments and review responses must be your own words. The line drawn on agents is about
  effort, not tooling: "I pointed an agent at the issue and here are the changes" is not
  acceptable, thoughtful iteration with an agent is. Open an issue first for a large
  AI-assisted contribution.
sources:
  - https://github.com/pydata/xarray/blob/main/doc/contribute/ai-policy.md
