notes: >
  The most granular disclosure requirement in this registry: you must disclose that you
  used an automated tool and be specific about which one. "A useful disclosure names the
  tool, the model and version it ran, and any reasoning-effort or thinking setting, so that
  reviewers know how much scrutiny to apply: `claude opus 4.8 (xhigh)` tells us something,
  `claude` does not." You must fully review and modify the tool's output. In issues, PRs
  and review comments, do not use AI to speak for you -- pasting AI-written replies does
  not count as engaging with a reviewer.
