version: 1
project: STAC
policy_url: https://github.com/stac-utils/stac-utils.github.io/blob/main/docs/ai-contribution-policy.md
homepage: https://stacspec.org/
repos:
  - github.com/stac-utils/*
stance: allowed
autonomous_agents: forbidden
disclosure: required_if_substantial
human_in_the_loop: required
copyright_statement: false
trailer: Assisted-by
notes: >
  Third member of the LLVM lineage, carrying its phrasing verbatim including the agent
  clause: "it bans agents that take action in our digital spaces without human approval,
  such as the GitHub @claude agent." Contributors may use whatever tools they like but must
  read and review all LLM-generated code or text before asking others to review it, and
  must label contributions containing substantial tool-generated content -- "use a commit
  message trailer like Assisted-by: <name of code assistant>". The contributor is always
  the author and is fully accountable.
sources:
  - https://github.com/stac-utils/stac-utils.github.io/blob/main/docs/ai-contribution-policy.md
confidence: verified
