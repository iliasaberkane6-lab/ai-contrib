version: 1
project: Kubernetes
policy_url: https://www.kubernetes.dev/docs/guide/pull-requests/
homepage: https://kubernetes.io/
repos:
  - github.com/kubernetes/*
stance: allowed
autonomous_agents: forbidden
disclosure: required
human_in_the_loop: required
copyright_statement: false
trailer: null
forbidden_trailers:
  - Assisted-by
  - Co-authored-by
  - Co-developed-by
notes: >
  Using AI tools to help write a PR is acceptable, but the author is responsible for
  understanding every change and must disclose AI use in the PR description. Attribution
  in commit metadata is explicitly NOT allowed: listing AI tooling as a co-author,
  co-signing commits with an AI tool, or using the assisted-by / co-developed trailers is
  forbidden -- the opposite of the Linux kernel rule. Large AI-generated PRs are not
  accepted, and you must respond to review comments without relying on AI tools or the PR
  will be closed.
sources:
  - https://www.kubernetes.dev/docs/guide/pull-requests/
confidence: verified
updated: 2026-08-29
