version: 1
project: Apache Arrow
policy_url: https://arrow.apache.org/docs/dev/developers/overview.html
homepage: https://arrow.apache.org/
repos:
  - github.com/apache/arrow
stance: allowed
autonomous_agents: forbidden
disclosure: required
human_in_the_loop: required
copyright_statement: true
trailer: null
notes: >
  "Thoughtful use of these tools can be beneficial", but be upfront about AI usage and
  summarise what was AI-generated, and only submit a PR if you can debug and own the
  changes yourself. PRs that appear fully generated with little author engagement may be
  closed. One rule found nowhere else, aimed at agent behaviour rather than at code:
  "AI agents should never tag or ping maintainers." The ASF's foundation-wide generative
  tooling guidance applies on top of this.
sources:
  - https://arrow.apache.org/docs/dev/developers/overview.html
confidence: verified
