notes: >
  Shares its text with the NumPy and SciPy policies -- a template propagating through the
  scientific Python ecosystem. You must disclose whether AI was used, naming the tools, how
  they were used, and which code or text is AI generated. "The use of an AI agent that
  writes code and then submits a pull request autonomously is not permitted." You must
  understand and be able to explain the code you submit.
