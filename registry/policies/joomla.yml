policy_url: https://developer.joomla.org/generative-ai-policy.html
homepage: https://www.joomla.org/
repos:
  - github.com/joomla/joomla-cms
stance: allowed
autonomous_agents: unspecified
disclosure: required
human_in_the_loop: required
copyright_statement: false
trailer: null
notes: >
  Discloses outside the commit entirely: "Any pull request that contains AI-assisted or
  AI-generated content (code, tests, documentation, or substantial comments) must be
  clearly marked" -- by adding [AI] at the start of the PR title and/or applying the
  [AI Generated] label. Contributors may use AI for research, code suggestions,
  documentation or problem analysis, but "submitting AI-generated code without personal
  validation is prohibited". Vibe coding or prompt-dump coding may get the PR closed and
  the contributor blocked.
sources:
