trailer: null
notes: >
  Prescribes the disclosure sentence itself rather than a format: include "This pull
  request includes code written with the assistance of AI. This code was reviewed and
  verified by me." Any AI-generated code you submit must be reviewed and tested by you, and
  you are expected to understand it and take final accountability. Explicitly out of
  bounds: entire work -- code, docs and PR description -- being LLM-generated without a
  clear understanding of the implementation.
sources:
