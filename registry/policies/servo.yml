notes: >
  "Contributions must not include content generated by large language models or other
  probabilistic tools, including but not limited to Copilot or ChatGPT." Covers code,
  documentation, pull requests, issues, comments and any other contribution -- including
  using AI to summarise a pull request. Using such tools for translation, for understanding
  the codebase, or for verifying a bug finding is permitted, provided you validate the
  output independently before filing. Maintainers may require non-compliant work to be
  rewritten without AI assistance.
