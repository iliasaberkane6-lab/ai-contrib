homepage: https://www.drupal.org/
stance: allowed
autonomous_agents: unspecified
disclosure: required_if_substantial
human_in_the_loop: required
copyright_statement: true
trailer: null
notes: >
  "If you use an AI tool to generate a significant portion of the code or text you are
  submitting, you must disclose it." Use the AI disclosure section of an existing issue or
  merge request template if there is one; otherwise append a clear, human-written
  statement. "You are fully responsible for the integrity of your submission." The policy
  openly notes a gap it has not closed yet: the terms of service will need to address
  automated agents acting on behalf of contributors more explicitly.
sources:
