version: 1
project: curl
policy_url: https://curl.se/dev/contribute.html
homepage: https://curl.se/
repos:
  - github.com/curl/curl
stance: allowed
autonomous_agents: review_required
disclosure: required_if_substantial
human_in_the_loop: required
copyright_statement: false
trailer: null
notes: >
  Code written with AI help is accepted, but must meet every normal requirement: coding
  standards, clarity, documentation and test cases. Disclosure is MANDATORY for security
  reports -- if you asked an AI tool to find problems in curl you must say so. Rule of
  thumb: if someone can spot that a contribution was AI-assisted, there is more work to do.
  Pasting an AI-generated report is rarely a good idea; findings are frequently fabricated.
sources:
  - https://curl.se/dev/contribute.html
confidence: verified
updated: 2026-08-29
