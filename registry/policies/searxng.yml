notes: >
  Shares its text with the Ghostty and Polars policies. All AI usage in any form must be
  disclosed, naming the tool (e.g. Claude Code, Cursor, Amp) and the extent of the
  assistance. Restricted rather than allowed because "AI should never be the main author of
  the PR" and "Issues and PR descriptions must be fully human-written." The human in the
  loop must fully understand all code. "People who produce bad contributions that are
  clearly AI (slop) will be blocked."
