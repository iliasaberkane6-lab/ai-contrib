version: 1
project: conda
policy_url: https://docs.conda.io/projects/conda/en/latest/dev-guide/contributing.html
homepage: https://docs.conda.io/
repos:
  - github.com/conda/*
stance: allowed
autonomous_agents: forbidden
disclosure: not_required
human_in_the_loop: required
copyright_statement: false
trailer: null
notes: >
  "You're welcome to use generative AI tools when contributing to conda." No disclosure is
  mandated, but accountability is: review and understand any AI-generated content before
  including it, and do not copy and paste AI responses. "Do not use AI agents or similar
  automated systems to submit your contributions or review Pull Requests autonomously."
  Unchecked AI-generated content may result in the pull request being closed.
sources:
  - https://docs.conda.io/projects/conda/en/latest/dev-guide/contributing.html
confidence: verified
