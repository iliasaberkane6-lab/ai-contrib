version: 1
project: TorchGeo
policy_url: https://github.com/torchgeo/governance/blob/main/AI-POLICY.md
homepage: https://torchgeo.readthedocs.io/
repos:
  - github.com/torchgeo/*
  - github.com/microsoft/torchgeo
stance: allowed
autonomous_agents: forbidden
disclosure: required
human_in_the_loop: required
copyright_statement: true
trailer: null
scope:
  issues: forbidden
notes: >
  Uses a graded self-declaration in the PR template rather than any commit metadata: every
  PR must disclose to what extent AI was involved, choosing between no AI, AI-assisted and
  AI-generated. The reasoning is copyright, not quality: "Fully autonomous or 'agentic' AI
  contributions are not accepted as AI cannot hold copyright", and an AI-generated PR with
  minimal human interaction is closed immediately on the same grounds. You must understand
  every line you contribute, all communication with maintainers should be made by humans,
  and PRs must stay short to avoid shifting the burden onto reviewers.
sources:
