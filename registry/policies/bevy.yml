version: 1
project: Bevy
policy_url: https://bevy.org/learn/contribute/policies/ai/
homepage: https://bevy.org/
repos:
  - github.com/bevyengine/bevy
stance: restricted
autonomous_agents: forbidden
disclosure: required
human_in_the_loop: required
copyright_statement: false
trailer: null
forbidden_trailers:
  - Co-authored-by
scope:
  media: forbidden
  docs: forbidden
  issues: forbidden
notes: >
  Not a blanket ban, but narrow: no AI-generated media, no AI-generated prose (docs, issues,
  PRs, release notes), no AI-generated communication, and no AI-authored commits -- only
  humans may be commit authors or listed as Co-authored-by. Any AI use must be disclosed
  with context about how it was used, and you must understand your submission and be able
  to articulate its design rationale. Community members are not obliged to review AI work.
sources:
  - https://bevy.org/learn/contribute/policies/ai/
confidence: verified
