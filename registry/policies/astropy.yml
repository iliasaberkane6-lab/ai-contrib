version: 1
project: Astropy
policy_url: https://github.com/astropy/astropy-project/blob/main/policies/ai-policy.md
homepage: https://www.astropy.org/
repos:
  - github.com/astropy/*
stance: allowed
autonomous_agents: forbidden
disclosure: required_if_substantial
human_in_the_loop: required
copyright_statement: false
trailer: null
notes: >
  "Astropy maintainers welcome contributions, including those developed with the assistance
  of generative AI tools." If such tools were used for substantive portions, contributors
  must describe that use in the change description. "Autonomous workflows ('agents') are
  not human contributors. Astropy reviewers expect to interact with the human controlling
  the account, or we will close the PR." Contributors must engage with reviewer feedback
  themselves rather than relaying AI-generated responses.
sources:
  - https://github.com/astropy/astropy-project/blob/main/policies/ai-policy.md
confidence: verified
updated: 2026-08-29
