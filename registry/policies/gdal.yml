notes: >
  Restricted because the permitted use is narrow: "LLMs may only be used as an improved
  auto-completion mechanism, or for repeated tasks (mechanical refactoring)." Any LLM usage
  must be indicated by ticket label, comment or commit message, accounting for what was
  written by whom or what. "Human-coordinated or uncoordinated (OpenClaw, etc) use of
  agents for submission of contributions to the GDAL repository is banned." Human
  contributors must be the primary authors.
