version: 1
project: typescript-eslint
policy_url: https://typescript-eslint.io/contributing/ai-policy/
homepage: https://typescript-eslint.io/
repos:
  - github.com/typescript-eslint/typescript-eslint
stance: allowed
autonomous_agents: unspecified
disclosure: not_required
human_in_the_loop: required
copyright_statement: false
trailer: null
scope:
  issues: forbidden
  docs: forbidden
notes: >
  "While we cannot and will not attempt to ban contributions which make use of AI, we ask
  that you use AI responsibly." Always review AI-generated code closely before submitting,
  and only use AI on contributions you would understand well enough to work on and respond
  to feedback on without AI. Avoid AI-generated content in written, non-code contributions
  (issues, comments, PR descriptions). Maintainers close non-compliant submissions.
sources:
  - https://typescript-eslint.io/contributing/ai-policy/
confidence: verified
updated: 2026-08-29
