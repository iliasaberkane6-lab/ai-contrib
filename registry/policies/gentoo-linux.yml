notes: >
  "It is expressly forbidden to contribute to Gentoo any content that has been created with
  the assistance of Natural Language Processing artificial intelligence tools." Applies to
  Gentoo contributions and official Gentoo projects. It does NOT prohibit packaging
  AI-related software, or software whose upstream used such tools. Reasons given: unsettled
  copyright, the ease of generating plausible but meaningless content, and ethical concerns.
  The Council states the decision can be revisited if a tool is made that avoids them.
