notes: >
  Frames AI output in the language of the BSD provenance lawsuits: "Code generated by a
  large language model or similar technology, such as GitHub/Microsoft's Copilot, OpenAI's
  ChatGPT, or Facebook/Meta's Code Llama, is presumed to be tainted code, and must not be
  committed without prior written approval by core." Restricted rather than forbidden
  because the approval route exists -- but it is prior, written, and from the core team.
