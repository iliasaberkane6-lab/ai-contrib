stance: allowed
autonomous_agents: forbidden
disclosure: required
human_in_the_loop: required
copyright_statement: false
trailer: null
notes: >
  You must disclose which AI tools were used and what for (code, commit messages, docs),
  and review and verify all AI-generated output against Django's architecture, tests and
  checks. AI tools must not replace human understanding. Do NOT request automated AI
  reviews (Copilot or similar) on pull requests to the Django repository -- they generate
  noise that distracts maintainers. Using such tools on your own fork first is fine.
