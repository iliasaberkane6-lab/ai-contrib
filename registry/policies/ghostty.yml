notes: >
  Ghostty is written with plenty of AI assistance and many maintainers embrace it, but ALL
  AI usage in any form must be disclosed -- name the tool (e.g. Claude Code, Cursor, Amp)
  and the extent of the assistance. The human in the loop must fully understand all code,
  and AI-generated content must be reviewed AND EDITED by a human before submission. No
  AI-generated media (art, images, video, audio). Maintainers may use AI at their
  discretion.
