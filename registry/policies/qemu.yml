notes: >
  Current policy is to DECLINE any contribution believed to include or derive from AI
  generated content, because the copyright and license status of such output is
  ill-defined and the contributor cannot honestly certify the DCO. Using AI for research,
  static analysis or debugging is explicitly fine as long as its output is not included in
  the submission. The project welcomes discussion of exceptions.
