notes: >
  Applies to all ASF projects, but PMCs evaluate and enforce it themselves, so an
  individual project may be stricter -- check the project's own CONTRIBUTING first.
  Contributors are responsible for disclosing any copyrighted material in a contribution
  that is not their original creation, and must still satisfy the ICLA. Naming the tool
  with a "Generated-by:" line is a RECOMMENDED practice, not a requirement.
