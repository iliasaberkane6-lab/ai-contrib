version: 1
project: EasyBuild
policy_url: https://docs.easybuild.io/policies/ai/
homepage: https://easybuild.io/
repos:
  - github.com/easybuilders/*
stance: allowed
autonomous_agents: unspecified
disclosure: required
human_in_the_loop: required
copyright_statement: false
trailer: null
scope:
  features: forbidden
notes: >
  Contributors must declare when they used AI, which tool AND model, and the extent of
  that use, and keep a human in the loop. The policy's own example shows the expected
  specificity: "I used GitHub CoPilot (GPT-5 mini) to code this PR". Separately, and
  unusually, the policy also governs the product rather than the process: "Functionality
  that adds AI features directly into the default EasyBuild installation will not be
  accepted."
sources:
  - https://docs.easybuild.io/policies/ai/
confidence: verified
updated: 2026-08-29
