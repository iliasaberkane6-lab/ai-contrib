name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm test
      # The registry must stay valid: every entry parses, and none claims
      # `verified` without a source. This is what caught the importer bug.
      - run: node dist/cli.js list --json > /dev/null
