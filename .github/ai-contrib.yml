# ai-contrib declares its own policy. Dogfooding: `ai-contrib check .` reads this.
version: 1
project: ai-contrib
policy_url: https://github.com/USER/ai-contrib/blob/main/CONTRIBUTING.md#ai-assisted-contributions
stance: allowed
autonomous_agents: review_required
disclosure: required
human_in_the_loop: required
